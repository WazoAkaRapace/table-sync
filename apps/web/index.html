<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content : Android Chromium ≥ 108 (défaut
         resizes-visual) ne rétrécit que le viewport VISUEL au clavier — les
         fixed inset-0 (modal du changeur, bottom sheets) gardent leur taille
         pleine, se font recouvrir par le clavier et n'ont rien à scroller
         (#106). Ce drapeau rend le clavier redimensionnant comme partout
         ailleurs : le viewport LAYOUT suit, le modal se redocke au-dessus et
         son contenu défile. iOS ignore le drapeau (sa parade est
         IOSViewportAnchor) ; Chromium < 108 faisait déjà ainsi. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#2a1f14" />
    <meta name="description" content="Table Sync — le compagnon de campagne partagé, pour le MD et les joueurs. Fiches, inventaire en kg et combat D&D 5e, synchronisés en temps réel." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Table Sync" />

    <style>
      /* ─── Splash « encre vivante » ───────────────────────────────────────
         Autonome par construction : zéro dépendance au bundle (Tailwind,
         Cinzel chargé par index.css) — ce style peint AVANT le télécharge-
         ment du module. Convention d'états : chaque propriété vit à sa
         valeur FINALE par défaut et les keyframes ne font qu'entrer DEPUIS
         l'invisible ; prefers-reduced-motion (ou un moteur sans animation)
         pose donc la page gravée, immobile, sans cas spécifique.
         Seules des propriétés compositor (transform/opacity) bougent —
         vieille tablette oblige. main.tsx retire le nœud (fondu ts-splash--
         --out) après le premier rendu React ; la garde navigateur et le
         noscript le retirent sur leurs chemins propres. */
      @property --ts-ink-x {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 105%;
      }
      #ts-splash {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
        background-color: #fdfaf3;
        /* Mêmes halos que body (index.css) : la main passe sans à-coup. */
        background-image:
          radial-gradient(at 20% 0%, rgba(184, 151, 90, 0.06) 0px, transparent 50%),
          radial-gradient(at 80% 100%, rgba(122, 31, 31, 0.04) 0px, transparent 50%);
      }
      #ts-splash.ts-splash--out {
        opacity: 0;
        filter: blur(2px);
        transform: scale(1.012);
      }
      /* Rafraîchissement en session : PAS de splash du tout. La classe est
         posée en <head> avant la première peinture — l'app peint
         directement, les états de chargement prennent le relais. */
      html.ts-calm #ts-splash {
        display: none;
      }
      .ts-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 26rem;
        padding: 0 1.5rem 8vh; /* décalage optique : le bloc respire au-dessus du centre */
      }
      .ts-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ts-glow {
        position: absolute;
        width: min(72vw, 320px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(212, 175, 55, 0.22), rgba(212, 175, 55, 0) 72%);
      }
      /* Le sceau officiel (jumeau inline d'icon-seal.svg — même dessin,
         identifiants préfixés ts- pour éviter toute collision). Animé par
         ses VRAIES couches : le tampon se pose, l'anneau de braise se
         trace, une comète l'orbite (LE signal de chargement), un éclat
         balaie le d20, les runes scintillent. */
      .ts-seal {
        position: relative;
        width: clamp(88px, 23vw, 118px);
        height: auto;
      }
      .ts-comet {
        opacity: 0.9;
        transform-box: fill-box;
        transform-origin: center;
      }
      .ts-glintrect {
        opacity: 0; /* éclat one-shot : absent hors mouvement */
      }
      .ts-word {
        margin: 1.35rem 0 0;
        font-family: Cinzel, Georgia, serif;
        font-weight: 700;
        font-size: clamp(1.1rem, 5.6vw, 1.6rem);
        letter-spacing: 0.34em;
        /* compense la chasse du tracking pour un vrai centrage optique */
        padding-left: 0.34em;
        color: #2a1f14;
        --ts-ink-x: 105%;
        -webkit-mask-image: linear-gradient(
          90deg,
          #000 0%,
          #000 var(--ts-ink-x),
          transparent calc(var(--ts-ink-x) + 24%)
        );
        mask-image: linear-gradient(
          90deg,
          #000 0%,
          #000 var(--ts-ink-x),
          transparent calc(var(--ts-ink-x) + 24%)
        );
      }
      .ts-rule {
        margin-top: 1.05rem;
        width: min(62vw, 300px);
      }
      /* Sélecteurs mono-classe partout : pas de composés frère/enfant, la
         cascade reste plate et lisible dans l'ordre du document. */
      .rline {
        display: block;
        height: 2px;
        background: #c9b074;
        transform-origin: 50% 50%;
      }
      .rline2 {
        height: 1px;
        margin-top: 3px;
        background: #ddcb9e;
      }
      .ts-motes {
        position: absolute;
        inset: 0;
      }
      .tmote {
        position: absolute;
        border-radius: 50%;
        background: #d4af37;
        opacity: 0; /* déco ambiante : invisible hors mouvement */
      }
      .ts-curtain {
        position: absolute;
        inset: 0;
        /* lavage de papier mouillé qui se lève — le seul recouvrement */
        background: linear-gradient(180deg, #e9dcb8 0%, #ddcb9e 55%, #d2bc88 100%);
        transform: translateY(-102%);
      }
      .ts-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: no-preference) {
        /* La transition de sortie vit ICI : sous prefers-reduced-motion,
           ts-splash--out reste un retrait sec (opacity 0), sans course. */
        #ts-splash {
          transition:
            opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1),
            filter 0.38s cubic-bezier(0.4, 0, 0.2, 1),
            transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes ts-curtain {
          from {
            transform: translateY(0);
          }
        }
        .ts-curtain {
          animation: ts-curtain 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both;
        }
        @keyframes ts-draw {
          from {
            stroke-dashoffset: 1;
          }
        }
        /* Le tampon se pose sur la page */
        @keyframes ts-stamp {
          from {
            opacity: 0;
            transform: scale(0.88);
          }
        }
        .ts-seal {
          animation: ts-stamp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
        }
        /* L'anneau de braise se trace (pathLength="1" : dash 1 = tout le tour) */
        .ts-ring {
          stroke-dasharray: 1;
          animation: ts-draw 0.7s cubic-bezier(0.33, 1, 0.68, 1) 0.45s both;
        }
        @keyframes ts-ring2 {
          from {
            opacity: 0;
          }
          to {
            opacity: 0.28;
          }
        }
        .ts-ring2 {
          animation: ts-ring2 0.5s ease-out 0.85s both;
        }
        /* La comète de braise entre, puis orbite sans fin */
        @keyframes ts-appear {
          from {
            opacity: 0;
          }
        }
        @keyframes ts-orbit {
          to {
            transform: rotate(360deg);
          }
        }
        .ts-comet {
          animation:
            ts-appear 0.5s ease-out 1.4s both,
            ts-orbit 3.2s linear 1.4s infinite;
        }
        /* Éclat unique qui balaie la face du d20 */
        @keyframes ts-glint {
          from {
            transform: translateX(-50px) skewX(-12deg);
            opacity: 1;
          }
          to {
            transform: translateX(150px) skewX(-12deg);
            opacity: 1;
          }
        }
        .ts-glintrect {
          animation: ts-glint 0.85s cubic-bezier(0.33, 1, 0.68, 1) 0.95s both;
        }
        /* Runes : scintillement lent, décalé */
        @keyframes ts-rune {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.3;
          }
        }
        .ts-rune1 {
          animation: ts-rune 3.6s ease-in-out 1.2s infinite;
        }
        .ts-rune2 {
          animation: ts-rune 4.2s ease-in-out 1.6s infinite;
        }
        .ts-rune3 {
          animation: ts-rune 3.9s ease-in-out 2s infinite;
        }
        .ts-rune4 {
          animation: ts-rune 4.5s ease-in-out 1.4s infinite;
        }
        @keyframes ts-glow {
          from {
            opacity: 0;
            transform: scale(0.82);
          }
        }
        .ts-glow {
          animation: ts-glow 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
        }
        @keyframes ts-ink {
          from {
            --ts-ink-x: -25%;
          }
        }
        .ts-word {
          animation: ts-ink 0.8s cubic-bezier(0.33, 1, 0.68, 1) 0.5s both;
        }
        @keyframes ts-rule {
          from {
            transform: scaleX(0);
          }
        }
        .rline {
          animation: ts-rule 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.95s both;
        }
        .rline2 {
          animation-delay: 1.05s;
        }
        .tmote {
          animation: ts-mote var(--ts-d, 8s) linear var(--ts-dl, 2s) infinite;
        }
        @keyframes ts-mote {
          0% {
            transform: translate3d(0, 10px, 0);
            opacity: 0;
          }
          15% {
            opacity: var(--ts-mo, 0.4);
          }
          85% {
            opacity: var(--ts-mo, 0.4);
          }
          100% {
            transform: translate3d(var(--ts-dx, 8px), -34px, 0);
            opacity: 0;
          }
        }
      }
    </style>

    <!-- La chorégraphie ne joue qu'au PREMIER lancement d'une session : un
         rafraîchissement (F5, pull-to-refresh) SAUTE le splash entièrement
         (display:none posé avant la première peinture) — l'app peint
         directement, les états de chargement prennent le relais.
         sessionStorage = par onglet ; une PWA relancée ouvre une nouvelle
         session → la gravure rejoue. -->
    <script>
      // biome-ignore lint/complexity/useArrowFunction: IIFE cohérente avec la garde de fin de body.
      (function () {
        try {
          if (sessionStorage.getItem('ts-splash-played')) {
            document.documentElement.classList.add('ts-calm');
          } else {
            sessionStorage.setItem('ts-splash-played', '1');
          }
        } catch {
          /* stockage indisponible (privé strict) : la gravure joue */
        }
      })();
    </script>

    <!-- Garde navigateur : le CSS produit par Tailwind v4 exige @property,
         oklch et color-mix — plancher effectif Safari 16.4 / Chromium 111 /
         Firefox 128 (le target JS « es2020 » de Vite ne rattrape pas le CSS).
         En dessous, la page s'afficherait cassée en silence : transformations
         qui fuient, couleurs tombées. Ce script inline s'exécute avant le
         bundle (les scripts module sont différés) ; si le navigateur manque
         un pilier, on pose un écran statique bilingue, on RETIRE le splash
         (rien ne viendrait plus le lacer — il recouvrirait l'écran à jamais)
         et on pose le drapeau __TS_UNSUPPORTED__ que main.tsx lit pour ne
         pas booter React. -->
    <script>
      // biome-ignore lint/complexity/useArrowFunction: cette garde doit rester en ES5 (var, function) — elle s'exécute précisément sur des navigateurs trop anciens pour parse un bundle es2020.
      (function () {
        var ok =
          typeof CSS !== 'undefined' &&
          typeof CSS.registerProperty === 'function' &&
          typeof CSS.supports === 'function' &&
          CSS.supports('color', 'color-mix(in oklab, red, blue)');
        if (ok) return;
        window.__TS_UNSUPPORTED__ = true;
        var splash = document.getElementById('ts-splash');
        if (splash) splash.parentNode.removeChild(splash);
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML =
            '<div style="max-width:34rem;margin:0 auto;padding:3rem 1.25rem;font-family:Georgia,serif;color:#2a1f14;line-height:1.6;text-align:left">' +

            '<p style="margin:0">Table Sync needs a recent browser: Safari 16.4+, Chrome/Edge 111+ or Firefox 128+. Update your browser, then reload the page.</p>' +
            '</div>';
        }
      })();
