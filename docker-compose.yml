services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-4010}:4000"
    volumes:
      - db-data:/app/data/db
      # Uploaded item illustrations (data/images/items) — without this, every
      # redeploy wipes the campaign's maps and letters with the container.
      - image-data:/app/data/images
    environment:
      - PORT=4000
      - DATABASE_PATH=/app/data/db/inventory.sqlite
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me-in-production}
      # Dev keeps the historical behavior: the web nginx proxies /api (and
      # sets X-Real-IP from the real client), and the API port is published
      # for direct access. TRUST_PROXY=true makes the rate limiter key on
      # X-Real-IP again — only safe when you accept spoofable keys (dev).
      - TRUST_PROXY=true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  image-data:
