# Production docker-compose using pre-built images from GHCR.
# Usage:
#   1. Copy .env.example to .env and set JWT_SECRET
#   2. docker compose -f docker-compose.prod.yml up -d
#
services:
  api:
    image: ghcr.io/wazoakarapace/table-sync-api:latest
    # NOT published: the web nginx proxies /api and /ws to api:4000 over the
    # internal compose network. Publishing the API port would let direct
    # clients forge X-Real-IP / X-Forwarded-For and evade the rate limiter
    # (which ignores those headers unless TRUST_PROXY=true). Re-enable only
    # if you actually need direct API access, and then set TRUST_PROXY
    # accordingly.
    # ports:
    #   - "${API_PORT:-4010}:4000"
    volumes:
      - db-data:/app/data/db
      # Uploaded item illustrations — survive container recreation.
      - image-data:/app/data/images
    environment:
      - PORT=4000
      - DATABASE_PATH=/app/data/db/inventory.sqlite
      # JWT_SECRET must be set — read from .env or shell environment
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env or environment}
      # Web Push (VAPID) — all three together or push stays cleanly disabled.
      # Generate once with `npm run vapid-keys`, NEVER rotate afterwards:
      # new keys orphan every existing subscription (docs/push-notifications.md).
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    restart: unless-stopped

  web:
    image: ghcr.io/wazoakarapace/table-sync-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  image-data:
