name: Release (tag)

# Releases pilotées par TAG (2026-11) : pousser un tag vX.Y.Z déclenche TOUT.
#   git tag v2026.11.01 && git push origin v2026.11.01
# — versionne les entrées changelog en attente (version:null) en bloc,
# — les stamp du sha du tag, committe (oxfmt) puis pousse main,
# — crée la release GitHub (notes = toutes les sections du lot),
# — construit les images multi-arch avec le calver (job build ci.yml).
# Un tag est un VRAI événement GitHub : pas d'anti-récursion, pas de dispatch
# fragile au merge. Le merge d'une PR ne release plus RIEN — merger accumule,
# tagger release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Versionner le lot + générer les notes
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version: $VERSION (tag $GITHUB_REF_NAME, sha $GITHUB_SHA)"
          npx tsx scripts/release-tag.ts "$VERSION" "$GITHUB_SHA"

      - name: Committer le changelog versionné + créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "table-sync-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.json
          git commit -m "changelog-release: lot $VERSION (sha ${GITHUB_SHA::7}) [skip ci]"
          git push origin HEAD:main

          # La release pointe le commit stampé (le tip de main après push).
          # --verify-tag vérifie le TAG (v<prefix>) — la version est nue.
          STAMPED=$(git rev-parse HEAD)
          if ! gh release create "$GITHUB_REF_NAME" --title "$VERSION" \
            --notes-file /tmp/release-notes.md --target "$STAMPED" \
            --verify-tag; then
            echo "release $GITHUB_REF_NAME existante — notes mises à jour"
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md || true
          fi

      # Le build (ci.yml) écoute release: published — mais une release créée
      # avec GITHUB_TOKEN ne déclenche NI cet événement NI un workflow_dispatch
      # (403 « Resource not accessible by integration ») : anti-récursion
      # GitHub. Le dispatch est donc un « best effort » : s'il échoue, le run
      # reste VERT et signale la relance à la main (gh workflow run … depuis
      # un jeton authentifié). Un PAT en secret resterait la seule automatisation.
      - name: Dispatcher le build d'images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh workflow run "Build & Push Docker Images" \
            --ref "$GITHUB_REF_NAME" -f version="$VERSION"; then
            echo "Build dispatché pour $VERSION (ref $GITHUB_REF_NAME)."
          else
            echo "::warning::dispatch refusé (GITHUB_TOKEN) — relancer : gh workflow run 'Build & Push Docker Images' --ref $GITHUB_REF_NAME -f version=$VERSION"
          fi
