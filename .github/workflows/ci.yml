name: Build & Push Docker Images

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: wazoakarapace/table-sync

jobs:
  # ---------- Security scan ----------
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check for secrets in tracked files
        run: |
          echo "Scanning for potential secrets..."
          if grep -rnE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" \
            --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sh' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude='package-lock.json' .; then
            echo "❌ Potential secret found!"
            exit 1
          fi
          echo "✅ No secrets detected"
      - name: Check .env files are not tracked
        run: |
          if git ls-files | grep -E "^\.env$|\.env\.(local|production|staging)"; then
            echo "❌ A .env file is tracked in git!"
            exit 1
          fi
          echo "✅ No .env files tracked"

  # ---------- Build per-platform on native runners (no QEMU) ----------
  build:
    needs: security-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          # API: amd64 on standard runner, arm64 on ARM runner
          - component: api
            runner: ubuntu-latest
            platform: amd64
          - component: api
            runner: ubuntu-24.04-arm
            platform: arm64
          # Web: same split
          - component: web
            runner: ubuntu-latest
            platform: amd64
          - component: web
            runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-api-amd64: ${{ steps.save-digest.outputs.api-amd64 }}
      digest-api-arm64: ${{ steps.save-digest.outputs.api-arm64 }}
      digest-web-amd64: ${{ steps.save-digest.outputs.web-amd64 }}
      digest-web-arm64: ${{ steps.save-digest.outputs.web-arm64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Version du PWA : le TAG de la release si elle existe (calver lisible,
      # ex. 2026.10.15 — déclaré dans l'entrée CHANGELOG.json), sinon le SHA
      # court du commit (builds de validation main).
      - name: Version stamp for the web build
        if: matrix.component == 'web'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "APP_VER=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "APP_VER=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build and push ${{ matrix.component }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.component == 'api' && 'Dockerfile.api' || 'Dockerfile.web' }}
          push: true
          # Push to a per-platform tag so we can merge later
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ matrix.platform }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }},mode=max
          build-args: |
            ${{ matrix.component == 'web' && 'VITE_API_URL=' || '' }}
            ${{ matrix.component == 'web' && format('APP_VERSION={0}', env.APP_VER) || '' }}

      - name: Save digest to artifact
        id: save-digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.component }}-${{ matrix.platform }}.txt"
          cat "/tmp/digests/${{ matrix.component }}-${{ matrix.platform }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}-${{ matrix.platform }}
          path: /tmp/digests/${{ matrix.component }}-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 1

  # ---------- Merge per-platform images into multi-arch manifests ----------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Read digests
        id: digests
        run: |
          AMD64=$(cat /tmp/digests/${{ matrix.component }}-amd64.txt)
          ARM64=$(cat /tmp/digests/${{ matrix.component }}-arm64.txt)
          echo "amd64=$AMD64" >> $GITHUB_OUTPUT
          echo "arm64=$ARM64" >> $GITHUB_OUTPUT
          echo "AMD64 digest: $AMD64"
          echo "ARM64 digest: $ARM64"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}"
          AMD64_DIGEST="${{ steps.digests.outputs.amd64 }}"
          ARM64_DIGEST="${{ steps.digests.outputs.arm64 }}"

          # Build the -t flag list from metadata tags
          TAGS="${{ steps.meta.outputs.tags }}"
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t $tag"
          done

          echo "Creating multi-arch manifest for $IMAGE"
          echo "  amd64: $AMD64_DIGEST"
          echo "  arm64: $ARM64_DIGEST"
          echo "  tags: $TAGS"

          docker buildx imagetools create \
            $TAG_ARGS \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:main \
            || echo "(inspection skipped — tag may differ on non-main pushes)"

  # ---------- Changelog release : stamp sha + release GitHub ----------
  # Au merge d'une PR : pose le SHA squash dans l'entrée de la version puis
  # crée la release <version> (notes = puces de l'entrée). La release
  # déclenche le build de déploiement (release: published) — les images
  # de prod portent le tag calver lisible en APP_VERSION.
  changelog-release:
    if: github.event_name == 'push'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stamp sha + notes, créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # L'association commit→PR relie aussi le commit squash à sa PR.
          PR_HEAD=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls"             --jq '.[0].head.sha' 2>/dev/null || echo "")
          if [ -z "$PR_HEAD" ] || [ "$PR_HEAD" = "null" ]; then
            echo "Pas de PR associée — pas de release auto."
            exit 0
          fi
          VERSION=$(node -p "require('./CHANGELOG.json')[0].version")
          echo "Version: $VERSION"
          npx tsx scripts/release-changelog.ts "$VERSION" "${{ github.sha }}"
          if ! git diff --quiet CHANGELOG.json; then
            git config user.name "table-sync-bot"
            git config user.email "actions@github.com"
            git add CHANGELOG.json
            git commit -m "changelog-release: sha ${GITHUB_SHA::7} pour $VERSION [skip ci]"
            git push
          fi
          # Créer la release sur le commit STAMPÉ (le checkout local est déjà à jour)
          gh release create "$VERSION" --title "$VERSION"             --notes-file /tmp/release-notes.md             --target "${{ github.sha }}" || echo "release existe déjà"
