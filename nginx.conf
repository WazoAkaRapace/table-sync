# Upstream API : pool keepalive — une seule poignée de main TCP pour tout le
# trafic /api au lieu d'une connexion par requête (l'ancienne forme
# « variable + resolver » interdisait le pooling). Le paramètre `resolve`
# (nginx ≥ 1.27.3) garde la tolérance au démarrage décalé : si l'API n'est
# pas encore résolue au boot, nginx démarre quand même et re-résout via le
# resolver Docker embarqué — le comportement de l'ancienne astuce.
resolver 127.0.0.11 valid=30s;
upstream api_backend {
    # Zone mémoire partagée : prérequis de la résolution à chaud (`resolve`).
    zone api_backend 64k;
    server api:4000 resolve;
    keepalive 16;
}

# Format d'accès maison : $remote_addr en premier champ (réécrite par realip
# ci-dessous quand elle vient d'un proxy de confiance), suivi des en-têtes
# BRUTS reçus — xff/xri permettent de déboguer d'un coup d'œil ce que le
# tunnel a réellement transmis (Pangolin/Newt, un futur proxy local…).
log_format table_sync '$remote_addr - $time_local "$request" $status '
                      '$body_bytes_sent xff="[$http_x_forwarded_for]" '
                      'xri="[$http_x_real_ip]"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout table_sync;

    # Uploads d'illustrations : Fastify accepte 5 Mo (server.ts multipart +
    # bodyLimit des routes image) — le défaut nginx (1 Mo) renvoyait un 413
    # avant même que l'API voie la photo de tablette.
    client_max_body_size 6m;

    # IP client réelle : DEUX chaînes de proxies coexistent devant ce nginx
    # (à l'extérieur : Pangolin — Traefik sur le VPS, tunnel WireGuard, Newt
    # en local ; à la maison : le reverse proxy nginx local). Les deux
    # terminent la connexion en source PRIVÉE : sans réécriture, $remote_addr
    # vaut le dernier proxy pour TOUT le monde et le rate-limit de l'API
    # (TRUST_PROXY=true, il lit le X-Real-IP que le location /api/ pose
    # ci-dessous) traite la table entière comme un seul client : 40 erreurs/
    # min PARTAGÉES, une rafale 4xx d'un joueur → 429 pour tous.
    #
    # Le transporteur commun des deux chaînes est X-Forwarded-For (posé par
    # Traefik, et $proxy_add_x_forwarded_for par le nginx local). RÉCURSIF :
    # on part de la DERNIÈRE adresse et on remonte en éliminant celles des
    # proxies de confiance (plages privées — Newt, le nginx local) jusqu'à
    # la première adresse non privée = le vrai client vu par le proxy public.
    # CAS VÉRIFIÉS en conteneur (docker run nginx:alpine) : XFF public →
    # réécrit ; XFF « forgé, public » → le public gagne (le forgé est avant) ;
    # XFF NE CONTENANT QUE du privé (maison) → retombe sur la première entrée
    # = l'IP LAN du client ; pas d'en-tête (accès direct au 8080) → pas de
    # réécriture. GOTCHA : real_ip_header N'ACCEPTE PAS de variable — un
    # « real_ip_header $var » passe nginx -t mais est traité comme un nom
    # d'en-tête littéral, réécriture jamais déclenchée (testé). Si un proxy
    # ne pose que X-Real-IP (pas de XFF), lui ajouter
    # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compression : les JSON de l'API sont déjà compressés par @fastify/compress
    # (gzip_proxied any ne re-comprime jamais une réponse qui porte déjà un
    # Content-Encoding) ; ce bloc couvre les statiques (JS/CSS/SVG) servis par
    # nginx. Sur une liaison lente, c'est ~5× moins d'octets sur le fil.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css image/svg+xml text/plain application/manifest+json;

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La coquille doit TOUJOURS se revalider (elle référence des assets
    # hashés neufs à chaque déploiement) — sans ça, le cache heuristique du
    # navigateur peut servir une coquille périmée après un push.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the api service.
    location /api/ {
        proxy_pass http://api_backend;
        # Buffers de réponse en RAM : le défaut (~8×4/8k ≈ 32-64 Ko) débordait
        # dans proxy_temp sur les grosses réponses JSON (détail de groupe) —
        # warn « buffered to a temporary file » et écriture disque gratuite.
        # 16×16k = 256 Ko par requête en cours : la table entière tient sans
        # toucher le disque.
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        # 1.1 + Connection vide : prérequis de la réutilisation des connexions
        # du pool keepalive (et des réponses chunked).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for real-time sync
    location /ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Service worker: NEVER cached long — the browser must see each new
    # version immediately (the asset regex below would freeze it for a year
    # with "immutable", bricking every future push update). Exact match `=`
    # outranks the regex, so the order doesn't matter — but keep it visible.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Sonde de version du PWA : le client compare sa version de build à ce
    # fichier pour proposer le rechargement — il doit toujours être frais.
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Manifeste PWA : couvert par aucune règle (l'extension .json n'est pas
    # dans la regex des assets) — une petite durée évite de le retélécharger
    # à chaque lancement tout en permettant les mises à jour.
    location = /manifest.json {
        expires 1h;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
